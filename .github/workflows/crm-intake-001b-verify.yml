name: J3S CRM Intake 001B Verification

on:
  push:
    branches:
      - j3s-crm-intake-001b
  pull_request:
    paths:
      - 'db/migrations/008_crm_intake_001b.sql'
      - 'src/domain/intake/**'
      - 'src/test/intake-*.test.ts'
      - 'src/test/fixtures/intake/**'
      - '.github/workflows/crm-intake-001b-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean
        run: rm -rf node_modules dist .output .vinxi

      - name: Install frozen dependency graph
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify formatting
        run: |
          npx prettier --write "src/**/*.{ts,tsx,css}" eslint.config.js vite.config.ts vitest.config.ts tsconfig.json package.json
          git diff --exit-code -- src eslint.config.js vite.config.ts vitest.config.ts tsconfig.json package.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
