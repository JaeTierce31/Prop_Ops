name: PROP-OPS Runtime Bundle 001

on:
  push:
    branches:
      - prop-ops-staging-auth-e2e-001
    paths:
      - 'runtime/**'
      - 'src/server/**'
      - 'src/domain/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-bundle-001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frozen dependency graph
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Bundle real Property Ops API handler for Neon Functions
        shell: bash
        run: |
          mkdir -p dist
          npx esbuild runtime/property-ops-function.ts \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=dist/index.mjs
          (cd dist && zip -q function.zip index.mjs)
          sha256sum dist/function.zip | tee dist/function.sha256
          sha256sum dist/index.mjs | tee dist/index.sha256

      - name: Publish immutable bundled source for staging loader
        shell: bash
        run: |
          mkdir -p artifacts/runtime
          cp dist/index.mjs artifacts/runtime/index.mjs
          cp dist/index.sha256 artifacts/runtime/index.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/runtime/index.mjs artifacts/runtime/index.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): freeze bundled Property Ops handler [skip ci]"
            git push origin HEAD:prop-ops-staging-auth-e2e-001
          fi

      - name: Upload immutable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: propops-runtime-${{ github.sha }}
          path: |
            dist/function.zip
            dist/function.sha256
            dist/index.mjs
            dist/index.sha256
          if-no-files-found: error
          retention-days: 7
